<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>HyperPad</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151922" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="HyperPad">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./hyperpad.webmanifest">
    <link rel="icon" href="./hyperpad-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./hyperpad-icon-180.png">
    <script>
        // Theme so früh wie möglich setzen, damit nichts aufblitzt
        try {
            var t = localStorage.getItem("hyperpad.theme") || "auto";
            document.documentElement.dataset.theme = t;
            document.documentElement.dataset.effective = t == "auto"
                ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        } catch (e) { }
    </script>
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <div id="hyperpad-app" class="hp-app" aria-busy="true">
        <div class="hp-boot">HyperPad wird geladen …</div>
    </div>
</body>

</html>
